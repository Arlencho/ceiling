# Development and integration tests only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veto
      POSTGRES_DB: veto_index
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veto -d veto_index"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
