name: service
on:
  pull_request:
    paths: ['service/**', 'app/lib/**', 'app/package*.json', '.github/workflows/service.yml']
  push:
    branches: [main]
    paths: ['service/**', 'app/lib/**', 'app/package*.json', '.github/workflows/service.yml']
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            service/package-lock.json
            app/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - name: Install app dependencies for grade parity
        run: npm ci --ignore-scripts --prefix ../app
      - run: npm run lint
      - name: Start Postgres 16
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: docker compose up -d --wait
      - name: Test against Postgres
        env:
          PGHOST: localhost
          PGPORT: '55432'
          PGUSER: veto
          PGDATABASE: veto_index
        run: PGPASSWORD="$POSTGRES_PASSWORD" npm test
      - run: npm run build
      - name: Stop Postgres
        if: always()
        run: docker compose down -v
