# The submission brief asks for "a repository someone else can clone and run".
# This workflow is the proof, and it is the thing that catches a regression in
# the refusal behaviour before a human notices.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Install the Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install 1.2.0
          avm use 1.2.0

      - name: Build and test
        run: make test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Pin npm 11 to match the lockfile generator. Node 22 on the runner
      # ships npm 10, and npm 10 ci rejects this lock (Missing: typescript@5.9.3).
      # Regenerating under npm 10 would drift on the next local npm 11 install.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx tsc --noEmit

  watcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: watcher/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  indexer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
