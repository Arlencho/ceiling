# The submission brief asks for "a repository someone else can clone and run".
# This workflow is the proof, and it is the thing that catches a regression in
# the refusal behaviour before a human notices.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Install the Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install 1.2.0
          avm use 1.2.0

      - name: Build and test
        run: |
          set -o pipefail
          make test 2>&1 | tee "$RUNNER_TEMP/ci-program-tests.txt"
      - name: Prove the program tests ran
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-assert-test-count.sh" program "$RUNNER_TEMP/ci-program-tests.txt"

  # The deploy-script checks read source and refuse a mismatched or missing
  # program keypair. They do not need a cluster or a funded key, so they run
  # here instead of waiting on the Solana toolchain in the program job.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy-script checks
        run: |
          set -o pipefail
          make test-scripts 2>&1 | tee "$RUNNER_TEMP/ci-scripts-tests.txt"
      - name: Prove the scripts tests ran
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-assert-test-count.sh" scripts "$RUNNER_TEMP/ci-scripts-tests.txt"

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            sdk/package-lock.json
      # Pin npm 11 to match the lockfile generator. Node 22 on the runner
      # ships npm 10, and npm 10 ci rejects this lock (Missing: typescript@5.9.3).
      # Regenerating under npm 10 would drift on the next local npm 11 install.
      - run: npm install -g npm@11
      - run: npm ci
      # App tests and app/e2e (included by tsconfig.test.json) import ../sdk/src,
      # so the typecheck needs the sdk dependencies installed to resolve them.
      - name: Install sdk deps for the cross-package typecheck
        run: npm ci
        working-directory: sdk
      - run: npm run typecheck
      # The suite ran only on developer machines until now: the job stopped at
      # the typecheck, so 100 tests across 17 files had never once been run by
      # CI. A typecheck does not execute anything, which is how a module that
      # could not even load on the Node version this job pins stayed green.
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/ci-app-tests.txt"
      - name: Prove the app tests ran
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-assert-test-count.sh" app "$RUNNER_TEMP/ci-app-tests.txt"

  terminal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            terminal/package-lock.json
            watcher/package-lock.json
      - run: npm ci
      # terminal imports the feed parsing and the money arithmetic from the
      # watcher rather than copying them, so the typecheck needs its deps too.
      - name: Install watcher deps for the cross-package typecheck
        run: npm ci
        working-directory: watcher
      - run: npm run typecheck
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/ci-terminal-tests.txt"
      - name: Prove the terminal tests ran
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-assert-test-count.sh" terminal "$RUNNER_TEMP/ci-terminal-tests.txt"

  watcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: watcher/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/ci-watcher-tests.txt"
      - name: Prove the watcher tests ran
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-assert-test-count.sh" watcher "$RUNNER_TEMP/ci-watcher-tests.txt"

  watcher-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build watcher image
        run: docker build -t veto-watcher:ci watcher

  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tools/package-lock.json
            indexer/package-lock.json
      - run: npm ci
      # tools/tsconfig.json includes ../indexer/src, so the typecheck needs
      # the indexer dependencies installed to resolve its imports.
      - name: Install indexer deps for the cross-package typecheck
        run: npm ci
        working-directory: indexer
      - run: npm run typecheck
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/ci-tools-tests.txt"
      - name: Prove the tools tests ran
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-assert-test-count.sh" tools "$RUNNER_TEMP/ci-tools-tests.txt"

  indexer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/ci-indexer-tests.txt"
      - name: Prove the indexer tests ran
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-assert-test-count.sh" indexer "$RUNNER_TEMP/ci-indexer-tests.txt"

  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            service/package-lock.json
            indexer/package-lock.json
            app/package-lock.json
      - run: npm ci
      - name: Install the shared event parser dependencies
        run: npm ci
        working-directory: indexer
      - name: Install app dependencies for grade parity
        run: npm ci --ignore-scripts --prefix ../app
      - run: npm run typecheck
      - run: npm run build
      - name: Start Postgres 16
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: docker compose up -d --wait
      - name: Test against Postgres and recorded devnet history
        env:
          PGHOST: localhost
          PGPORT: '55432'
          PGUSER: veto
          PGDATABASE: veto_index
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/ci-service-tests.txt"
      - name: Prove the service tests ran
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-assert-test-count.sh" service "$RUNNER_TEMP/ci-service-tests.txt"
      - name: Stop Postgres
        if: always()
        run: docker compose down -v

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      # The lockfile was written by npm 11. Node 22 on the runner ships npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/ci-sdk-tests.txt"
      - name: Prove the sdk tests ran
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-assert-test-count.sh" sdk "$RUNNER_TEMP/ci-sdk-tests.txt"

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cli/package-lock.json
            sdk/package-lock.json
      # The lockfile was written by npm 11. Node 22 on the runner ships npm 10.
      - run: npm install -g npm@11
      - name: Install and build the SDK
        run: |
          npm ci
          npm run build
        working-directory: sdk
      - run: npm ci
      - run: npm run typecheck
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/ci-cli-tests.txt"
      - name: Prove the cli tests ran
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci-assert-test-count.sh" cli "$RUNNER_TEMP/ci-cli-tests.txt"
