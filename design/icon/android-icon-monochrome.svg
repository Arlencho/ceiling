<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Themed icon, single colour. Android tints the alpha channel, so the slip is
    one solid shape and the ledger entries are knocked out of it: the stopped
    stroke and the cap rule read as negative space.
  -->
  <defs>
    <mask id="knockout">
      <rect x="322" y="284" width="380" height="456" rx="16" fill="#FFFFFF"/>
      <rect x="382" y="404" width="260" height="30" fill="#000000"/>
      <rect x="382" y="512" width="206" height="56" fill="#000000"/>
      <rect x="588" y="478" width="27" height="124" fill="#000000"/>
    </mask>
  </defs>
  <rect x="322" y="284" width="380" height="456" rx="16" fill="#0F1A16" mask="url(#knockout)"/>
</svg>
