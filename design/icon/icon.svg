  <!--
    Veto app mark: the decision slip.
    A parchment slip (the record) on spruce ink (the screen), carrying a ledger
    stroke that runs into the cap rule and stops flush against it. The boundary
    held, the answer recorded. Palette from docs/DESIGN_DECISION.md.
  -->
  <rect width="1024" height="1024" fill="#0F1A16"/>
  <rect x="322" y="284" width="380" height="456" rx="16" fill="#EDE6D6"/>
  <rect x="382" y="404" width="260" height="30" fill="#0F1A16"/>
  <rect x="382" y="512" width="206" height="56" fill="#0F1A16"/>
  <rect x="588" y="478" width="27" height="124" fill="#0F1A16"/>
</svg>
