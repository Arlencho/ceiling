<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Veto app mark: the decision slip.
    A parchment slip (the record) on spruce ink (the screen), carrying one heavy
    ledger stroke that runs into the cap rule and stops flush against it. The
    boundary held, the answer recorded. Designed at 48px first: a single stroke
    and the rule it stops against, with empty slip around them, so the stop is
    the loudest relationship at launcher size. Palette from
    docs/DESIGN_DECISION.md.
  -->
  <rect width="1024" height="1024" fill="#0F1A16"/>
  <rect x="322" y="284" width="380" height="456" rx="16" fill="#EDE6D6"/>
  <rect x="372" y="456" width="184" height="112" fill="#0F1A16"/>
  <rect x="556" y="408" width="56" height="208" fill="#0F1A16"/>
</svg>
