<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Veto app mark: the decision slip.
    A parchment slip (the record) on spruce ink (the screen), carrying one heavy
    ledger stroke that runs toward the cap rule and halts before it. Between
    stroke and rule stand 112 units of bare slip, the same measure as the
    stroke's own weight, so the stop reads as air and not as contact: a thing
    that was going somewhere and did not get there. Flush contact read as the
    standard log out glyph, so the gap is sized for 48px first, five and a
    quarter pixels of clear slip at launcher size, not for balance at 1024. The
    rule stays full and unbroken, because the boundary held. Palette from
    docs/DESIGN_DECISION.md.
  -->
  <rect width="1024" height="1024" fill="#0F1A16"/>
  <rect x="322" y="284" width="380" height="456" rx="16" fill="#EDE6D6"/>
  <rect x="372" y="456" width="72" height="112" fill="#0F1A16"/>
  <rect x="556" y="408" width="56" height="208" fill="#0F1A16"/>
</svg>
