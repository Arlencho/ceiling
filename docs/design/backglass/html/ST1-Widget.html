body{margin:0;background:#0F1A16;}
button,a{font-family:inherit;}

@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

.rise{animation:rise 0.7s cubic-bezier(0.22,1,0.36,1) both;}
.rise-1{animation-delay:0.05s;}
.rise-2{animation-delay:0.20s;}
.rise-3{animation-delay:0.35s;}
.rise-4{animation-delay:0.50s;}
.live-lamp{animation:liveLamp 3s ease-in-out infinite;}
.cover{transform-origin:right center;animation:reveal 1.2s cubic-bezier(0.65,0,0.35,1) 0.5s both;}
.blk{flex:1;border-radius:2px;background:#C9A24D;}
.blk-off{flex:1;border-radius:2px;background:rgba(201,162,77,0.18);}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#D3CCBB;font-size:11px;font-weight:600;}

  .cover{transform:scaleX(0);}
}
