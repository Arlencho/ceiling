skip_local_validator = true

# LiteSVM 0.10 cannot load the SBPFv3 ELF that `anchor build` emits by default.
# Build the program the tests embed with:
#   ANCHOR_BUILD_SBF_ARCH=v0 anchor build --ignore-keys
# `--ignore-keys` is required because target/deploy/veto-keypair.json does not
# match declare_id, and we must not rewrite the program id to suit a test key.

[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
veto = "3zNp5EuQ61pR9stq4rzYsRQnjg4AYAgW8nxRje6koQmV"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"

[hooks]

[programs.devnet]
veto = "3zNp5EuQ61pR9stq4rzYsRQnjg4AYAgW8nxRje6koQmV"
